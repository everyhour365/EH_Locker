<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Locker">
<title>EH Locker System</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#edeff2;--surface:#fff;--border:#e5e7eb;
--text:#111827;--sub:#6b7280;--hint:#9ca3af;
--brand:#2563eb;--brand-light:#e8f0fe;
--seongsu:#378ADD;--guui:#D85A30;--danger:#dc2626;
--bc:var(--seongsu);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.header{background:var(--surface);padding:16px;padding-top:calc(16px + env(safe-area-inset-top));position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.header h1{font-size:18px;font-weight:600;letter-spacing:-0.4px}
.header p{font-size:10px;color:var(--hint);margin-top:3px}
.hbtns{display:flex;gap:8px}
.icon-btn{border:none;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--sub)}
.icon-btn.primary{background:var(--brand);color:#fff}
.icon-btn:active{opacity:.85}
.icon-btn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabbar{display:flex;background:var(--surface);padding:0 16px;position:sticky;top:calc(75px + env(safe-area-inset-top));z-index:99;gap:4px;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;background:none;border:none;color:var(--sub);padding:13px 0;font-size:14px;font-weight:700;cursor:pointer;border-bottom:2.5px solid transparent}
.tab-btn.active{color:var(--tc);border-bottom-color:var(--tc)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;font-weight:700}

.wrap{padding:12px 16px;display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto}
.card{background:var(--surface);border-radius:16px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(17,24,39,.04);padding:16px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.card-title{font-size:15px;font-weight:600;color:var(--bc)}
.card-sub{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

.grid{display:inline-grid;gap:6px}
.cell{width:44px;height:44px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;cursor:default}
.cell.used{border:none;background:color-mix(in srgb,var(--bc) 28%,transparent);color:var(--text)}
.cell.off{border:none;background:#e5e7eb;color:#fff}
.cell.alert{border:2px dashed var(--danger);cursor:pointer}
.cell.alert:not(.used){color:var(--danger)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-head b{font-size:14px}
.link{font-size:13px;font-weight:700;color:var(--bc);text-decoration:none;background:none;border:none;cursor:pointer}
.warn{font-size:12px;color:var(--danger);margin-bottom:10px;line-height:1.5}
.empty{font-size:13px;color:var(--sub);padding:6px 0}
.item{padding:12px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;scroll-margin-top:140px}
.item:first-of-type{border-top:none}
.item.flash{animation:flash 1.2s}
@keyframes flash{0%,60%{background:#fef2f2}100%{background:transparent}}
.item .no{font-weight:700;font-variant-numeric:tabular-nums}
.item .st{font-size:13px;margin-left:4px;color:var(--sub)}
.item .st.over{color:var(--danger);font-weight:600}
.item .meta{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;font-variant-numeric:tabular-nums}
.item .sent{font-size:11px;color:#16a34a;font-weight:600;margin-top:2px}
.btns{display:flex;gap:6px;flex-shrink:0}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--sub);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.fill{background:var(--bc);border-color:var(--bc);color:#fff}
.btn:active{opacity:.85}
.btn.dis{opacity:.45;pointer-events:none}

.err{background:#fef2f2;color:var(--danger);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.skeleton{height:220px;border-radius:16px;background:linear-gradient(90deg,#f3f4f6,#e5e7eb,#f3f4f6);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.foot{font-size:11px;color:var(--hint);text-align:center;margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111827;color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:.2s;z-index:300}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{font-size:16px;margin-bottom:14px}
.sheet label{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px;font-weight:600}
.sheet input,.sheet textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;color:var(--text);background:var(--bg);outline:none}
.sheet input:focus,.sheet textarea:focus{border-color:var(--brand)}
.sheet textarea{min-height:110px;line-height:1.6;resize:vertical}
.sheet .hint{font-size:11px;color:var(--hint);margin-top:5px;line-height:1.5}
.sheet .row{display:flex;gap:8px;margin-top:16px}
.sheet .row .btn{flex:1;text-align:center}
.sheet .row .btn.fill{background:var(--brand);border-color:var(--brand)}
</style>
</head>
<body>
<div class="header">
  <div><h1>Locker System</h1><p id="updated">불러오는 중…</p></div>
  <div class="hbtns">
    <button class="icon-btn" id="settingsBtn" aria-label="설정">⚙</button>
    <button class="icon-btn primary" id="refreshBtn" aria-label="새로고침">↻</button>
  </div>
</div>
<div class="tabbar" id="tabbar"></div>
<div class="wrap" id="app"><div class="skeleton"></div></div>

<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h2>설정</h2>
    <label>접속 키</label>
    <input id="setKey" type="password" autocomplete="off" placeholder="Apps Script ACCESS_KEY">
    <label>연장 금액</label>
    <input id="setPrice" placeholder="예: 10,000원">
    <label>입금 계좌</label>
    <input id="setAccount" placeholder="예: 카카오뱅크 3333-00-0000000 홍길동">
    <label>문자 문구</label>
    <textarea id="setTpl"></textarea>
    <div class="hint">{지점} {번호} {만료일} {연장일} {금액} {계좌} 가 자동으로 바뀝니다. 이 설정은 이 기기에만 저장됩니다.</div>
    <div class="row">
      <button class="btn" id="setReset">문구 초기화</button>
      <button class="btn fill" id="setSave">저장</button>
    </div>
  </div>
</div>

<script>
// ─── 설정 ────────────────────────────────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyumEL_p516n7f8gZx36gB5H7v3j4kQWfCup5Q3_0LY7uIWmyaTbme978USqhg0Y292gw/exec'; // Apps Script 웹앱 배포 URL (비어 있으면 데모 데이터)
const EXTEND_DAYS = 28;      // 4주 연장
const NOTICE_DAYS = 3;       // 만료 D-3부터 확인 필요
const OVERDUE_LIMIT = 14;    // 만료 후 14일까지 표시 (보관 14일 정책)
const ADMIN_LOCKER_URL = 'https://admin.studymoa.me/locker';
const BRANCH_ORDER = ['seongsu', 'guui'];
const BRANCH_COLOR = { seongsu: '#378ADD', guui: '#D85A30' };
const DEFAULT_PRICE = '1만 원';
const DEFAULT_ACCOUNT = '카카오뱅크 3333-25-0277947 (포아워스)';
const DEFAULT_TPL =
`안녕하세요! 에브리아워입니다.
사물함 이용관련 안내문자드립니다!

이용하시던 사물함이 만료되어 한 달 연장도와드렸습니다.
아래 계좌로 {금액} 입금 부탁드립니다.

{계좌}

사물함은 이용을 원치 않으시면 만료 전 정리 부탁드립니다.
감사합니다!`;

// ─── 상태 / 저장 ─────────────────────────────────────────────────────────────
const store = {
  get(k, d = '') { try { return localStorage.getItem('lock_' + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('lock_' + k, v); } catch {} }
};
let state = { branch: store.get('branch', 'seongsu'), data: null, sent: {}, error: null };

// ─── 데이터 ──────────────────────────────────────────────────────────────────
async function callGas(payload) {
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ ...payload, key: store.get('key') }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error === 'unauthorized' ? '접속 키가 맞지 않습니다 (⚙ 설정)' : j.error);
  return j;
}
async function load(fresh = false) {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  try {
    if (!GAS_URL) { state.data = demoData(); state.sent = {}; }
    else { const j = await callGas({ action: 'lockers', fresh }); state.data = j.data; state.sent = j.sent || {}; }
    state.error = null;
  } catch (e) { state.error = String(e.message || e); }
  btn.classList.remove('spin');
  render();
}

// ─── 확인 필요 계산 ──────────────────────────────────────────────────────────
const DAY = 86400000;
const parse = (s) => { if (!s) return null; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? null : d; };
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function dayDiff(end) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const e = new Date(end); e.setHours(0, 0, 0, 0);
  return Math.round((e - t) / DAY);
}
function getAlerts(b) {
  if (!b) return [];
  const off = new Set();
  ((b.layout && b.layout.data) || []).flat().forEach((c) => { if (c && c.t === 'locker' && c.disabled) off.add(String(c.n)); });
  const um = {}; (b.usage || []).forEach((u) => um[u.lockerNo] = u);
  const out = [];
  (b.info || []).forEach((i) => {
    if (off.has(i.lockerNo)) return;
    const end = parse((um[i.lockerNo] || {}).endDT || i.maxEndDT);
    if (!end) return;
    const diff = dayDiff(end);
    if (diff > NOTICE_DAYS || diff < -OVERDUE_LIMIT) return;
    const k = um[i.lockerNo] ? { name: um[i.lockerNo].name, phone: um[i.lockerNo].phone, extendCount: um[i.lockerNo].extendCount } : (b.lastKnown || {})[i.lockerNo];
    out.push({
      no: i.lockerNo, diff, endDate: ymd(end), newEndDate: ymd(new Date(end.getTime() + EXTEND_DAYS * DAY)),
      name: (k && k.name) || null, phone: (k && k.phone) || null, extendCount: k ? k.extendCount : null
    });
  });
  return out.sort((a, b2) => a.diff - b2.diff);
}

// ─── 복사 / 토스트 ───────────────────────────────────────────────────────────
// 클릭 핸들러 안에서 동기적으로 호출해야 iOS Safari에서 복사가 허용됨
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch { return false; }
}
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ─── 렌더 ────────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stLabel = (d) => d < 0 ? `${-d}일 경과` : d === 0 ? '오늘 만료' : `D-${d}`;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

function buildMessage(a, branchName) {
  const tpl = store.get('tpl') || DEFAULT_TPL;
  const price = store.get('price') || DEFAULT_PRICE, account = store.get('account') || DEFAULT_ACCOUNT;
  return tpl.split('\n').filter((line) => !(line.includes('{금액}') && !price) && !(line.includes('{계좌}') && !account)).join('\n')
    .replace(/{지점}/g, branchName).replace(/{번호}/g, a.no).replace(/{만료일}/g, a.endDate)
    .replace(/{연장일}/g, a.newEndDate).replace(/{금액}/g, price).replace(/{계좌}/g, account);
}

function render() {
  const bar = document.getElementById('tabbar');
  const app = document.getElementById('app');
  document.documentElement.style.setProperty('--bc', BRANCH_COLOR[state.branch]);
  bar.innerHTML = BRANCH_ORDER.map((id) => {
    const b = state.data && state.data[id];
    const n = b ? getAlerts(b).length : 0;
    return `<button class="tab-btn ${id === state.branch ? 'active' : ''}" style="--tc:${BRANCH_COLOR[id]}" data-b="${id}">${b ? esc(b.name) : id}${n ? `<span class="badge">${n}</span>` : ''}</button>`;
  }).join('');
  bar.querySelectorAll('.tab-btn').forEach((el) => el.onclick = () => { state.branch = el.dataset.b; store.set('branch', state.branch); render(); });

  document.getElementById('updated').textContent = state.data ? `업데이트 ${state.data.updatedAt}${GAS_URL ? '' : ' · 데모'}` : '불러오는 중…';
  if (state.error && !state.data) { app.innerHTML = `<div class="err">불러오기 실패: ${esc(state.error)}</div>`; return; }
  if (!state.data) return;

  const b = state.data[state.branch];
  const alerts = getAlerts(b);
  const alertSet = new Set(alerts.map((a) => a.no));
  const rows = (b.layout && b.layout.data) || [];
  const cols = (rows[0] || []).length;
  const grid = rows.map((row) => row.map((c) => {
    if (!c || c.t !== 'locker') return '<div></div>';
    const no = String(c.n), used = !!c.name && !c.disabled;
    const cls = ['cell', c.disabled ? 'off' : used ? 'used' : '', alertSet.has(no) ? 'alert' : ''].join(' ');
    return `<button class="${cls}" data-no="${no}" ${alertSet.has(no) ? '' : 'tabindex="-1"'}>${esc(c.n)}</button>`;
  }).join('')).join('');

  const items = alerts.map((a) => {
    const msg = buildMessage(a, b.name);
    const sentAt = state.sent[`${state.branch}|${a.no}|${a.endDate}`];
    const sms = a.phone ? `sms:${a.phone}${isIOS ? '&' : '?'}body=${encodeURIComponent(msg)}` : '';
    return `<div class="item" id="it-${a.no}">
      <div style="min-width:0">
        <div><span class="no">${esc(a.no)}번</span> ${esc(a.name || '이용자 정보 없음')}<span class="st ${a.diff < 0 ? 'over' : ''}">${stLabel(a.diff)}</span></div>
        <div class="meta">만료 ${a.endDate} → 연장 시 ${a.newEndDate}${a.extendCount != null ? ` · 연장 ${a.extendCount}회` : ''}</div>
        ${sentAt ? `<div class="sent">✓ 문자 ${esc(sentAt.slice(5))}</div>` : ''}
      </div>
      <div class="btns">
        <button class="btn" data-copy="${a.no}">문구</button>
        ${sms ? `<a class="btn fill" href="${sms}" data-sent="${a.no}|${a.endDate}">문자</a>` : '<span class="btn dis">번호 없음</span>'}
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="card">
      <div class="card-head"><span class="card-title">${esc(b.name)} 사물함</span><span class="card-sub">이용 ${b.usageCount} / ${b.totalCount}</span></div>
      <div style="overflow-x:auto"><div class="grid" style="grid-template-columns:repeat(${cols},44px)">${grid}</div></div>
      <div class="legend">
        <span><i style="background:color-mix(in srgb,var(--bc) 28%,transparent)"></i>이용중</span>
        <span><i style="background:#e5e7eb"></i>사용 안함</span>
        <span><i style="border:2px dashed var(--danger)"></i>확인 필요</span>
      </div>
    </div>
    <div class="card">
      <div class="sec-head"><b>확인 필요 ${alerts.length}건</b><a class="link" href="${ADMIN_LOCKER_URL}" target="_blank" rel="noopener">연장하기 ↗</a></div>
      ${alerts.length ? items : '<div class="empty">처리할 사물함이 없습니다.</div>'}
    </div>
    <div class="foot">연장은 스터디모아 어드민에서 처리한 뒤 ↻ 새로고침</div>`;

  app.querySelectorAll('.cell.alert').forEach((el) => el.onclick = () => {
    const t = document.getElementById('it-' + el.dataset.no);
    if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
  });
  app.querySelectorAll('[data-copy]').forEach((el) => el.onclick = async () => {
    const a = alerts.find((x) => x.no === el.dataset.copy);
    const msg = buildMessage(a, b.name);
    if (await copyText(msg)) toast('문구 복사됨'); else window.prompt('복사해서 사용하세요', msg);
  });
  app.querySelectorAll('[data-sent]').forEach((el) => el.addEventListener('click', () => {
    const [no, endDate] = el.dataset.sent.split('|');
    const a = alerts.find((x) => x.no === no);
    copyText(buildMessage(a, b.name)).then((ok) => toast(ok ? '문구 복사됨' : '복사 실패 — 문자앱 본문을 확인하세요'));
    if (!GAS_URL) return;
    callGas({ action: 'markSent', branch: state.branch, lockerNo: no, endDate }).then((j) => { state.sent = j.sent || state.sent; }).catch(() => {});
  }));
}

// ─── 설정 시트 ───────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
$('settingsBtn').onclick = () => {
  $('setKey').value = store.get('key'); $('setPrice').value = store.get('price') || DEFAULT_PRICE;
  $('setAccount').value = store.get('account') || DEFAULT_ACCOUNT; $('setTpl').value = store.get('tpl') || DEFAULT_TPL;
  $('sheetBg').classList.add('open');
};
$('sheetBg').onclick = (e) => { if (e.target.id === 'sheetBg') $('sheetBg').classList.remove('open'); };
$('setReset').onclick = () => { $('setTpl').value = DEFAULT_TPL; };
$('setSave').onclick = () => {
  const keyChanged = $('setKey').value !== store.get('key');
  store.set('key', $('setKey').value.trim()); store.set('price', $('setPrice').value.trim() === DEFAULT_PRICE ? '' : $('setPrice').value.trim());
  store.set('account', $('setAccount').value.trim() === DEFAULT_ACCOUNT ? '' : $('setAccount').value.trim());
  store.set('tpl', $('setTpl').value.trim() === DEFAULT_TPL ? '' : $('setTpl').value);
  $('sheetBg').classList.remove('open');
  keyChanged ? load(true) : render();
};
$('refreshBtn').onclick = () => load(true);

// ─── 데모 데이터 (GAS_URL 미설정 시) ─────────────────────────────────────────
function demoData() {
  const d = (n) => ymd(new Date(Date.now() + n * DAY)) + ' 23:59:59';
  const mk = (name, color, total, spec) => {
    const cols = 5, rows = [];
    for (let r = 0; r < total / cols; r++) rows.push([]);
    const usage = [], info = [], lastKnown = {};
    for (let n = 1; n <= total; n++) {
      const s = spec[n]; const row = rows[Math.floor((n - 1) / cols)];
      const used = s && s.end !== undefined && s.live !== false;
      row.push({ t: 'locker', n: String(n), name: used ? s.name : null, disabled: n > total - 3 });
      if (s) {
        info.push({ lockerNo: String(n), maxEndDT: d(s.end) });
        if (s.live !== false) usage.push({ lockerNo: String(n), startDT: d(s.end - 28), endDT: d(s.end), extendCount: s.ext || 0, name: s.name, phone: s.phone || '01012345678' });
        else lastKnown[String(n)] = s.known ? { name: s.known, phone: '01099998888', extendCount: 2 } : null;
      } else { const e = 10 + n; info.push({ lockerNo: String(n), maxEndDT: d(e) }); usage.push({ lockerNo: String(n), startDT: d(e - 28), endDT: d(e), extendCount: 1, name: '이용자' + n, phone: '01000000000' }); row[row.length - 1].name = '이용자' + n; }
    }
    Object.keys(lastKnown).forEach((k) => lastKnown[k] === null && delete lastKnown[k]);
    return { name, totalCount: total, usageCount: usage.length, layout: { data: rows }, info, usage, lastKnown };
  };
  return {
    updatedAt: ymd(new Date()) + ' ' + pad(new Date().getHours()) + ':' + pad(new Date().getMinutes()),
    seongsu: mk('성수점', 0, 30, { 8: { name: '김민수', end: 1, ext: 7 }, 13: { name: '박서연', end: 3 }, 28: { live: false, end: -2, known: '이도윤' } }),
    guui: mk('구의점', 0, 18, { 5: { live: false, end: -11 }, 7: { name: '최하늘', end: 0, ext: 3 } })
  };
}

load();
setInterval(() => load(false), 180000);
</script>
